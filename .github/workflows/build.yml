# Runs on the GitHub mirror (github.com/WiselessGroup/Crocell). The source of
# truth is git.wiseless.net, which pushes here; a tag v* pushed there ends up
# as a GitHub release with the AppImage.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  core:
    # Forgejo also runs .github/workflows when it has Actions turned on;
    # these jobs are for GitHub's runners only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: make vet test
        working-directory: core

  app:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  appimage:
    needs: [core, app]
    # The oldest glibc on offer: an image built here runs on older distros
    # too, not the other way round.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev zsync desktop-file-utils
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build
        env:
          # No FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          scripts/build-appimage.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            dist/Crocell-x86_64.AppImage
            dist/Crocell-x86_64.AppImage.zsync
          if-no-files-found: error

  # Windows, macOS and Android have no service or VPN layer yet, so nothing
  # from these is published. They are built so the day they get one, the
  # rest already compiles.
  desktop:
    needs: [core, app]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: go build -tags with_gvisor ./cmd/crocelld ./cmd/crocell
        working-directory: core
      - run: flutter build ${{ matrix.target }} --release
        working-directory: app

  android:
    needs: [core, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
        working-directory: app

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Crocell-x86_64.AppImage Crocell-x86_64.AppImage.zsync \
            --repo "$GITHUB_REPOSITORY" \
            --title "Crocell ${GITHUB_REF_NAME#v}" \
            --generate-notes
