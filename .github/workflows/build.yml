# Runs on the GitHub mirror (github.com/WiselessGroup/Crocell). The source of
# truth is git.wiseless.net, which pushes here; a tag v* pushed there ends up
# as a GitHub release with the AppImage, the Windows installer, the macOS
# disk image and the Android APK.
name: Build

# A push to master runs the tests only; the four packages are built for a
# tag (and released) or on demand from the Actions tab, not twice for the
# same commit. Docs-only pushes skip CI altogether.
on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['**.md', '.github/release-notes/**', 'assets/screenshots/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  core:
    # Forgejo also runs .github/workflows when it has Actions turned on;
    # these jobs are for GitHub's runners only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: make vet test
        working-directory: core

  app:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  appimage:
    if: github.server_url == 'https://github.com' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    # The oldest glibc on offer: an image built here runs on older distros
    # too, not the other way round.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev zsync desktop-file-utils
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build
        env:
          # No FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: scripts/build-appimage.sh "$(scripts/version.sh)"
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            dist/Crocell-x86_64.AppImage
            dist/Crocell-x86_64.AppImage.zsync
          if-no-files-found: error

  windows:
    if: github.server_url == 'https://github.com' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Inno Setup
        run: command -v iscc || [[ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]] || choco install innosetup --no-progress -y
      - run: scripts/build-windows.sh "$(scripts/version.sh)"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Crocell-x86_64-Setup.exe
          if-no-files-found: error

  macos:
    if: github.server_url == 'https://github.com' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    # Apple silicon runner: the .dmg is arm64 only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: scripts/build-macos.sh "$(scripts/version.sh)"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/Crocell-arm64.dmg
          if-no-files-found: error

  # On master, only when the core changed: builds the AAR ahead of time, in the
  # background, because a tag can restore caches from master but not from an
  # earlier tag. With the AAR ready a release's Android build takes minutes.
  android-core:
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/android-core

  android:
    if: github.server_url == 'https://github.com' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          # Its own: the shared one is saved first by a job with no Android
          # artifacts in it.
          cache-key: 'flutter-android-:version:-:arch:-:hash:'
      - uses: ./.github/actions/android-core
      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [[ -n $ANDROID_KEYSTORE ]]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            # A release signed with the debug key could never be updated
            # by one signed with the real key.
            echo "::error::ANDROID_KEYSTORE secret is missing, refusing to release a debug-signed APK"
            exit 1
          fi
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: scripts/build-android.sh "$(scripts/version.sh)"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/Crocell.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Packages build in parallel with the tests; nothing ships unless both
    # the tests and every package came through.
    needs: [core, app, appimage, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Written notes when the tag has them, generated ones otherwise.
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [[ -f $notes ]]; then about=(--notes-file "$notes"); else about=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" \
            Crocell-x86_64.AppImage Crocell-x86_64.AppImage.zsync \
            Crocell-x86_64-Setup.exe Crocell-arm64.dmg Crocell.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Crocell ${GITHUB_REF_NAME#v}" \
            "${about[@]}"
