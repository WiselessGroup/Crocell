// Contract between the Crocell client (Flutter) and the core (Go).
//
// Desktop: gRPC over a unix socket / named pipe to crocelld.
// Mobile: the same messages, serialized, over a platform channel to the VPN
// service. The client must not care which one it talks to.
//
// Go code is generated into core/api/crocellv1: `make proto` in core/.
syntax = "proto3";

package crocell.v1;

option go_package = "git.wiseless.net/fureunoir/crocell/core/api/crocellv1";

import "google/protobuf/timestamp.proto";

service Core {
  // State
  rpc GetStatus(GetStatusRequest) returns (Status);
  rpc WatchStatus(WatchStatusRequest) returns (stream Status);

  // Connection
  rpc Connect(ConnectRequest) returns (Status);
  rpc Disconnect(DisconnectRequest) returns (Status);
  rpc SelectNode(SelectNodeRequest) returns (Status);

  // Subscriptions
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc AddSubscription(AddSubscriptionRequest) returns (Subscription);
  rpc RefreshSubscription(RefreshSubscriptionRequest) returns (Subscription);
  rpc RemoveSubscription(RemoveSubscriptionRequest) returns (RemoveSubscriptionResponse);
  // Every subscription with a link. One failing does not stop the rest.
  rpc RefreshAllSubscriptions(RefreshAllSubscriptionsRequest) returns (RefreshAllSubscriptionsResponse);

  // Node quality: entry, exit, latency. Streams results as they come.
  rpc ProbeNodes(ProbeNodesRequest) returns (stream ProbeResult);

  // Settings
  rpc GetSettings(GetSettingsRequest) returns (Settings);
  rpc UpdateSettings(Settings) returns (Settings);

  // Running programs, to pick one for a routing rule.
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);

  // geoip.dat / geosite.dat: when they were fetched and what is inside.
  rpc GetGeoInfo(GetGeoInfoRequest) returns (GeoInfo);
  rpc UpdateGeo(UpdateGeoRequest) returns (GeoInfo);

  // The core's recent log, for "copy the logs" in the app. Subscription
  // links are taken out.
  rpc GetLogs(GetLogsRequest) returns (Logs);

  // "Quit completely": the service disconnects and exits, and clients that
  // see Status.quitting close too. Not available where the core lives inside
  // the app (Android).
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

// ---------- State ----------

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_DISCONNECTED = 1;
  CONNECTION_STATE_CONNECTING = 2;
  CONNECTION_STATE_CONNECTED = 3;
  CONNECTION_STATE_DISCONNECTING = 4;
  CONNECTION_STATE_FAILED = 5;
}

message Status {
  ConnectionState state = 1;
  // While disconnected: the node Connect would resume.
  string subscription_id = 2;
  string node_id = 3;
  google.protobuf.Timestamp connected_since = 4;
  Traffic traffic = 5;
  // Human-readable reason when state is FAILED. Never contains secrets.
  string error = 6;
  TunnelMode tunnel_mode = 7;
  // HTTP+SOCKS on 127.0.0.1 while connected, for the client to put into
  // the system proxy settings (that has to happen as the user, not root).
  uint32 mixed_port = 8;
  // Does the internet actually work through the VPN? Checked right after
  // connecting and every couple of minutes while connected, along the path
  // the system uses (TUN or the mixed port). Unset until the first check.
  // Not "check": that name collides with GeneratedMessage.check() in Dart.
  ProbeResult live_check = 9;
  bool checking = 10;
  // The service's own version. After an app update the service may still be
  // the old one (Linux and macOS keep a copy of it outside the app), and the
  // client offers to reinstall it when this differs from its own.
  string core_version = 11;
  // The most used nodes, most used first: time spent connected with the
  // internet working, not clicks. Up to four, the current one may be among
  // them, and the menus show three others.
  repeated FavoriteNode favorites = 12;
  // The name of node_id, for those without the subscription list.
  string node_name = 13;
  // The service is about to exit because someone asked it to.
  bool quitting = 14;
}

message FavoriteNode {
  string subscription_id = 1;
  string node_id = 2;
  string name = 3;
}

message Traffic {
  uint64 up_bytes = 1;
  uint64 down_bytes = 2;
  uint64 up_rate = 3;   // bytes per second, last sample
  uint64 down_rate = 4;
}

message GetStatusRequest {}
message WatchStatusRequest {}

// ---------- Connection ----------

message ConnectRequest {
  string subscription_id = 1;
  string node_id = 2; // empty: last used node
}
message DisconnectRequest {}
message SelectNodeRequest {
  string subscription_id = 1;
  string node_id = 2;
}

// ---------- Subscriptions ----------

message Subscription {
  string id = 1;
  string title = 2;
  // The link itself is a secret: the core keeps it, the client gets a
  // masked version for display.
  string url_masked = 3;
  string format = 4; // links, clash
  uint64 upload_bytes = 5;
  uint64 download_bytes = 6;
  uint64 total_bytes = 7; // 0 = unlimited
  google.protobuf.Timestamp expire = 8; // unset = never
  uint32 update_interval_hours = 9;
  string web_page = 10;
  string support = 11;
  string announce = 12;
  google.protobuf.Timestamp fetched_at = 13;
  repeated Node nodes = 14;
}

message Node {
  string id = 1;     // stable across refreshes: hash of type+server+port+credentials
  string name = 2;
  string type = 3;   // vless, hysteria2, ...
  string network = 4; // tcp, xhttp, ws, grpc, ...
  string server = 5;
  uint32 port = 6;
  ProbeResult last_probe = 7;
}

message ListSubscriptionsRequest {}
message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
}
message AddSubscriptionRequest {
  string url = 1;
}
message RefreshSubscriptionRequest {
  string id = 1;
}
message RemoveSubscriptionRequest {
  string id = 1;
}
message RemoveSubscriptionResponse {}
message RefreshAllSubscriptionsRequest {}
message RefreshAllSubscriptionsResponse {
  uint32 refreshed = 1;
  repeated RefreshFailure failed = 2;
}
message RefreshFailure {
  string subscription_id = 1;
  string title = 2;
  string error = 3; // never contains the link
}

// ---------- Probes ----------

message ProbeNodesRequest {
  string subscription_id = 1;
  repeated string node_ids = 2; // empty: all nodes of the subscription
}

message ProbeResult {
  string node_id = 1;
  repeated string entry_ips = 2;
  string entry_country = 3; // ISO 3166-1 alpha-2, from local GeoIP
  string exit_ip = 4;
  string exit_country = 5;
  string exit_colo = 6;     // nearest Cloudflare PoP, e.g. FRA
  uint32 latency_ms = 7;    // a real HTTPS request through the node
  string error = 8;
  google.protobuf.Timestamp probed_at = 9;
}

// ---------- Settings ----------

enum TunnelMode {
  TUNNEL_MODE_UNSPECIFIED = 0;
  TUNNEL_MODE_SYSTEM_PROXY = 1; // no root, browsers and well-behaved apps
  TUNNEL_MODE_TUN = 2;          // whole system
}

// Where matching traffic goes.
enum RouteAction {
  ROUTE_ACTION_UNSPECIFIED = 0;
  ROUTE_ACTION_PROXY = 1;  // through the selected node
  ROUTE_ACTION_DIRECT = 2; // straight out
  ROUTE_ACTION_BLOCK = 3;  // nowhere
}

// What a rule matches. Specific beats general: rules apply in this order,
// so a single site in Proxy wins over a geosite set in Direct.
enum RuleKind {
  RULE_KIND_UNSPECIFIED = 0;
  RULE_KIND_PROCESS_PATH = 1;    // /usr/bin/steam, C:\Games\dota2.exe
  RULE_KIND_PROCESS_NAME = 2;    // steam, Telegram.exe; package name on Android
  RULE_KIND_DOMAIN = 3;          // wiseless.net, exactly
  RULE_KIND_DOMAIN_WILDCARD = 4; // *.wiseless.net: subdomains, not the domain
  RULE_KIND_DOMAIN_SUFFIX = 5;   // +.wiseless.net: the domain and subdomains
  RULE_KIND_IP_CIDR = 6;         // 10.0.0.0/8, 2001:db8::/32, a bare IP
  RULE_KIND_GEOSITE = 7;         // ru-blocked (geosite:ru-blocked)
  RULE_KIND_GEOIP = 8;           // telegram (geoip:telegram)
}

message RouteRule {
  RuleKind kind = 1;
  string value = 2;
  RouteAction action = 3;
}

message DnsSettings {
  // Resolvers for everything, queried through the VPN. Empty: defaults
  // (Cloudflare and Google DoH). https://…, tls://…, plain IPs.
  repeated string servers = 1;
  // For direct traffic and node addresses. Empty: the system resolver.
  repeated string direct_servers = 2;
  // Real addresses instead of fake-ip. Some games and P2P need it.
  bool real_ip = 3;
}

message GeoSettings {
  // An https:// URL or a local file path. Empty: runetfreedom.
  string geoip_source = 1;
  string geosite_source = 2;
  uint32 update_hours = 3; // 0: daily
}

message Settings {
  reserved 2; // app_rules, replaced by rules
  TunnelMode tunnel_mode = 1;
  uint32 mixed_port = 3; // 0: default 7890
  string tun_stack = 4;  // mixed (default), system, gvisor
  repeated RouteRule rules = 5;
  RouteAction final_action = 6; // everything else; unspecified means proxy
  DnsSettings dns = 7;
  GeoSettings geo = 8;
  bool disable_ipv6 = 9;
  bool allow_lan = 10;   // others on the network may use the proxy port
  bool connect_on_start = 11;
  // Move to another node of the subscription by itself when this one stops
  // working. A node picked by hand stays while it works.
  bool auto_node = 12;
}

message GetSettingsRequest {}

// ---------- Processes ----------

message ListProcessesRequest {}

message Process {
  string name = 1; // what a program rule matches; the package on Android
  string path = 2;
  string label = 3; // the app's own name on Android, else empty
}

message ListProcessesResponse {
  repeated Process processes = 1;
}

// ---------- Geo databases ----------

message GetLogsRequest {}
message Logs {
  string text = 1;
}

message ShutdownRequest {}
message ShutdownResponse {}

message GetGeoInfoRequest {}
message UpdateGeoRequest {}

message GeoInfo {
  google.protobuf.Timestamp geoip_updated = 1;   // unset: not downloaded
  google.protobuf.Timestamp geosite_updated = 2;
  repeated string geoip_categories = 3;
  repeated string geosite_categories = 4;
  bool updating = 5;
  string error = 6; // last update failure, empty when fine
}
